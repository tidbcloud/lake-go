name: Dependency security regression

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  root-module:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.24'
      - run: go mod verify
      - run: go test -race .

  opentelemetry-example:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: examples/opentelemetry
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.25'
      - run: go mod verify
      - run: go test -race ./...
      - run: go vet ./...
