name: CI

on:
  schedule:
    - cron: '0 0 * * *'
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        server-version:
          - "nightly"
          - "v1.2.881"
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.26"

      - name: Unittest
        run: |
          make test

      - name: Integration Test
        env:
          TEST_LAKE_DSN: "lake://databend:databend@localhost:8000/default?sslmode=disable"
          DATABEND_QUERY_VERSION: ${{ matrix.server-version }}
          DATABEND_META_VERSION: ${{ matrix.server-version }}
        run: |
          make integration

  # to avoid block pr
  test-compact:
    strategy:
      fail-fast: false
      matrix:
        driver-version:
          - "v0.9.2"
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.26"

      - name: Configure Go for private repo
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git config --global url."https://x-access-token:${GH_TOKEN}@github.com/".insteadOf "https://github.com/"
          echo "GOPRIVATE=github.com/tidbcloud" >> "$GITHUB_ENV"

      - name: Compat Test
        env:
          TEST_LAKE_DSN: "lake://databend:databend@localhost:8000/default?sslmode=disable"
          LAKE_GO_VERSION: ${{ matrix.driver-version }}
          DATABEND_QUERY_VERSION: nightly
          DATABEND_META_VERSION: nightly
        run: |
          make compat

  notify:
    if: failure()
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Notify Dev Team
        uses: actions/github-script@v7
        env:
          WEBHOOK_URL: ${{ secrets.DEV_TEAM_WEBHOOK_URL }}
        with:
          script: |
            const body = {
              msg_type: 'text',
              content: {
                text: '⚠️ Lake GO Integration Tests Failed: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}',
              }
            }
            const response = await fetch(process.env.WEBHOOK_URL, {
              method: 'POST',
              body: JSON.stringify(body),
              headers: {'Content-Type': 'application/json'}
            });
            const result = await response.json();
            console.log(result);
