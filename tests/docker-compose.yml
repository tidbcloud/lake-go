services:
  minio:
    # docker.io/minio/minio is no longer available (Docker Hub returns 404 and
    # the open-source binary download site https://dl.min.io returns 410 Gone).
    # coollabsio/minio is a mirror of the official image with the same
    # entrypoint, command and ports, so `command: server /data` keeps working.
    # The tag is pinned because the mirror only keeps a limited window of tags.
    image: docker.io/coollabsio/minio:RELEASE.2025-10-15T17-29-55Z
    command: server /data
    ports:
      - "9000:9000"
    volumes:
      - ./data:/data
  meta:
    image: docker.io/datafuselabs/databend-meta:${DATABEND_META_VERSION:-nightly}
    volumes:
      - ./config/databend-meta-node-1.toml:/conf.toml:ro
    command: -c /conf.toml
    ports:
      - "28101:28101"
    healthcheck:
      test: "databend-metactl status || exit 1"
      interval: 2s
      retries: 10
      start_period: 2s
      timeout: 1s
  query:
    image: docker.io/datafuselabs/databend-query:${DATABEND_QUERY_VERSION:-nightly}
    volumes:
      - ./config/databend-query-node-1.toml:/conf.toml:ro
    command: -c /conf.toml
    environment:
      - QUERY_DATABEND_ENTERPRISE_LICENSE
    ports:
      - "8900-8902:8900" # flight sql handler
      # - "8001-8003:8000" # http handler
    depends_on:
      minio:
        condition: service_started
      meta:
        condition: service_healthy
    healthcheck:
      test: "curl -f localhost:8080/v1/health || exit 1"
      interval: 2s
      retries: 10
      start_period: 2s
      timeout: 1s
  lb:
    image: docker.io/nginx
    volumes:
      - ./config/nginx.conf:/etc/nginx/nginx.conf:ro
    ports:
      - "8000:8000"
    depends_on:
      query:
        condition: service_healthy
